<!DOCTYPE html>

<body>

    <input type="checkbox" autocomplete="off" id="overlay-toggle">

        <label for="overlay-toggle"
               onclick="playAudioAndVideo(); startTitleAnimation();">

    <audio loop preload="auto" id="audio">

        <source src="background.mp4" type="video/mp4">

    <div class="center">
        <p class="nameMain">

        </p>

        <div class="panel discordPanel">
            <a target="_blank" href="https://discord.com/users/1397165578648551576">
                <img class="discordAvatar" src="discord.png">
            </a>
            <p class="discordName">Discord</p>
            <p class="discordMotd">bub3nsik</p>
        </div>

        <div class="gap"></div>

        <div class="panel telegramPanel">
            <a target="_blank" href="https://github.com/bub3ns">
                <img class="telegramAvatar" src="telegram.png">
            </a>

            <p class="telegramMotd">bub3ns</p>
        </div>

        <div class="gap"></div>
        
        <div class="panel namemcPanel">
            <a target="_blank" href="https://namemc.com/profile/bub3ns">

                <img class="namemcAvatar" src="avatar.png">
            </a>
            <p class="namemcName">NameMC #2</p>
            <p class="namemcMotd">awkb</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
